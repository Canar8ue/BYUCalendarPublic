<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1360" width="1960" height="1360" role="img" aria-labelledby="archTitle archDesc" font-family="Archivo, 'Segoe UI', Roboto, system-ui, sans-serif">
  <title id="archTitle">BYU Calendar system architecture</title>
  <desc id="archDesc">Two app surfaces (customer calendar and moderator portal) on one Node deployment behind Cloudflare and Nginx, sharing one Cloudflare D1 database, calling BYU calendar feeds, checked-in snapshots, Resend and the DeepSeek API. A planned AI workflow automation reads sources, enriches and stages drafts for moderator review.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#202124"/>
    </marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8710a"/>
    </marker>
    <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <rect width="1960" height="1360" fill="#ffffff"/>

  <!-- ============ header ============ -->
  <text x="60" y="62" font-size="30" font-weight="800" fill="#202124" letter-spacing="-0.8">BYU Calendar · system architecture</text>
  <text x="60" y="92" font-size="14" fill="#5f6368">How requests, listings, and moderator decisions move through the product — and where the two apps meet.</text>

  <g font-size="11" fill="#3c4043">
    <line x1="1230" y1="56" x2="1282" y2="56" stroke="#202124" stroke-width="2" marker-end="url(#ah)"/>
    <text x="1292" y="60">runs today</text>
    <line x1="1440" y1="56" x2="1492" y2="56" stroke="#5f6368" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ahG)"/>
    <text x="1502" y="60">planned</text>
    <line x1="1630" y1="56" x2="1682" y2="56" stroke="#e8710a" stroke-width="2" marker-end="url(#ahO)"/>
    <text x="1692" y="60">cross-app data</text>
  </g>

  <!-- ============ actors ============ -->
  <rect x="430" y="140" width="370" height="110" rx="12" fill="#ffffff" stroke="#202124" stroke-width="1.5"/>
  <text x="450" y="176" font-size="16" font-weight="700" fill="#202124">Visitor / BYU member</text>
  <text x="450" y="202" font-size="11" fill="#3c4043">Browses, searches, saves events, exports .ics</text>
  <text x="450" y="222" font-size="11" fill="#3c4043">A verified @byu.edu account to post or report</text>

  <rect x="860" y="140" width="470" height="110" rx="12" fill="#ffffff" stroke="#202124" stroke-width="1.5"/>
  <text x="880" y="176" font-size="16" font-weight="700" fill="#202124">Moderator</text>
  <text x="880" y="202" font-size="11" fill="#3c4043">Address listed in CALENDAR_ADMIN_EMAILS</text>
  <text x="880" y="222" font-size="11" fill="#3c4043">Reviews reports, hides listings, answers privacy mail</text>

  <!-- ============ cloudflare ============ -->
  <rect x="385" y="325" width="960" height="110" rx="14" fill="#202124"/>
  <rect x="380" y="320" width="960" height="110" rx="14" fill="#ffffff" stroke="#202124" stroke-width="1.5"/>
  <text x="400" y="352" font-size="16" font-weight="700" fill="#202124">Cloudflare</text>
  <text x="400" y="380" font-size="11" fill="#3c4043">DNS · proxy · TLS · MX records · caches /campus/* assets for 4 hours</text>
  <text x="400" y="400" font-size="11" fill="#3c4043">Adds CF-IPCountry and the client IP · origin certificate stays Let's Encrypt</text>

  <!-- ============ host boundary ============ -->
  <rect x="60" y="470" width="1300" height="830" rx="20" fill="none" stroke="#5f6368" stroke-width="1.5"/>
  <text x="80" y="502" font-size="10.5" font-weight="700" fill="#5f6368" letter-spacing="1.2">SELF-MANAGED LINUX HOST</text>
  <text x="80" y="520" font-size="10.5" fill="#5f6368">systemd · Nginx · Node 22 · workerd · crontab</text>

  <!-- ============ nginx ============ -->
  <rect x="385" y="535" width="960" height="110" rx="14" fill="#202124"/>
  <rect x="380" y="530" width="960" height="110" rx="14" fill="#ffffff" stroke="#202124" stroke-width="1.5"/>
  <text x="400" y="562" font-size="16" font-weight="700" fill="#202124">Nginx</text>
  <text x="400" y="590" font-size="11" fill="#3c4043">TLS termination (Let's Encrypt) · gzip (event JSON is ~1 MB uncompressed)</text>
  <text x="400" y="610" font-size="11" fill="#3c4043">proxy_pass → 127.0.0.1:8788 · sets X-Real-IP and X-Forwarded-For</text>

  <!-- ============ node container ============ -->
  <rect x="380" y="700" width="960" height="450" rx="16" fill="#f8f9fa" stroke="#202124" stroke-width="1.5"/>
  <rect x="398" y="712" width="556" height="26" rx="13" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
  <text x="414" y="730" font-size="11" font-weight="500" fill="#3c4043">Node 22 + Wrangler/workerd · one process on 127.0.0.1:8788</text>

  <!-- customer panel -->
  <rect x="410" y="760" width="345" height="360" rx="12" fill="#202124"/>
  <rect x="405" y="755" width="345" height="360" rx="12" fill="#ffffff" stroke="#202124" stroke-width="1.5"/>
  <path d="M405 810 h345 v-43 a12 12 0 0 0 -12 -12 h-321 a12 12 0 0 0 -12 12 z" fill="#e8f0fe"/>
  <text x="425" y="789" font-size="17" font-weight="700" fill="#174ea6">Customer-facing app</text>
  <text x="425" y="806" font-size="10.5" fill="#174ea6">React 19 · Next App Router (Vinext) · AI-built</text>
  <rect x="405" y="810" width="345" height="4" fill="#1a73e8"/>
  <g font-size="11" fill="#3c4043">
    <text x="425" y="842">Week · month · agenda · map views</text>
    <text x="425" y="863">/explore — Lost on Campus game</text>
    <text x="425" y="884">Search + grouped filters · .ics export</text>
    <text x="425" y="905">Sign-in, /account, saved events and filters</text>
    <text x="425" y="931" font-weight="500" fill="#202124">Public endpoints</text>
    <text x="425" y="952" font-size="10.5" fill="#5f6368">/api/events · /api/search · /api/listings</text>
    <text x="425" y="970" font-size="10.5" fill="#5f6368">/api/preferences · /api/profile</text>
    <text x="425" y="988" font-size="10.5" fill="#5f6368">/api/refresh · /api/analytics</text>
  </g>
  <line x1="425" y1="1006" x2="730" y2="1006" stroke="#dadce0"/>
  <text x="425" y="1026" font-size="10" fill="#5f6368">Source keys and auth secrets stay server-side;</text>
  <text x="425" y="1042" font-size="10" fill="#5f6368">the browser only receives the calendar it renders.</text>

  <!-- admin panel -->
  <rect x="955" y="760" width="355" height="360" rx="12" fill="#202124"/>
  <rect x="950" y="755" width="355" height="360" rx="12" fill="#ffffff" stroke="#202124" stroke-width="1.5"/>
  <path d="M950 810 h355 v-43 a12 12 0 0 0 -12 -12 h-331 a12 12 0 0 0 -12 12 z" fill="#f3e8fd"/>
  <text x="970" y="789" font-size="17" font-weight="700" fill="#7627bb">Admin portal</text>
  <text x="970" y="806" font-size="10.5" fill="#7627bb">React-rendered HTML/CSS · same Node server</text>
  <rect x="950" y="810" width="355" height="4" fill="#7627bb"/>
  <g font-size="11" fill="#3c4043">
    <text x="970" y="842">/moderation — report queue</text>
    <text x="970" y="863">Hide, restore, edit or correct listings</text>
    <text x="970" y="884">/moderation/emails — privacy inbox</text>
    <text x="970" y="905">Reply as privacy@byucalendar.com</text>
    <text x="970" y="926">/moderation/analytics — usage summary</text>
    <text x="970" y="952" font-weight="500" fill="#202124">Endpoints</text>
    <text x="970" y="973" font-size="10.5" fill="#5f6368">/api/moderation/* · /api/emails/*</text>
    <text x="970" y="991" font-size="10.5" fill="#5f6368">/api/emails/inbound (signed webhook)</text>
  </g>
  <rect x="970" y="1030" width="252" height="28" rx="14" fill="#f3e8fd" stroke="#7627bb" stroke-width="1"/>
  <text x="986" y="1048" font-size="10.5" font-weight="500" fill="#7627bb">Gate: CALENDAR_ADMIN_EMAILS</text>

  <!-- ============ D1 ============ -->
  <rect x="385" y="1195" width="960" height="95" rx="14" fill="#202124"/>
  <rect x="380" y="1190" width="960" height="95" rx="14" fill="#ffffff" stroke="#202124" stroke-width="1.5"/>
  <text x="400" y="1222" font-size="15" font-weight="700" fill="#202124">Cloudflare D1 — SQLite in .wrangler/state · 19 tables</text>
  <text x="400" y="1248" font-size="10.5" fill="#3c4043">accounts · sessions · bookmarks · saved filters · listings · tags · reports · source snapshots · event_overrides</text>
  <text x="400" y="1266" font-size="10.5" fill="#3c4043">listing_moderation · inbound_emails · email_replies · analytics rows · action_limits · user_profiles</text>

  <!-- ============ crontab ============ -->
  <rect x="100" y="920" width="230" height="160" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="118" y="952" font-size="14" font-weight="700" fill="#202124">Host crontab</text>
  <g font-size="10.5" fill="#3c4043">
    <text x="118" y="978">every 20 min</text>
    <text x="118" y="996" font-size="10" fill="#5f6368">POST /api/refresh</text>
    <text x="118" y="1022">every 15 min</text>
    <text x="118" y="1040" font-size="10" fill="#5f6368">POST /api/reminders/dispatch</text>
    <text x="118" y="1057" font-size="10" fill="#5f6368">bearer token · 7–10 AM MT only</text>
  </g>

  <!-- ============ external services ============ -->
  <!-- sources -->
  <rect x="1500" y="700" width="400" height="80" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="1520" y="728" font-size="13.5" font-weight="700" fill="#202124">BYU + department calendars</text>
  <text x="1520" y="750" font-size="10.5" fill="#3c4043">20 sources: iCal, Brightspot pages, Events.json</text>
  <text x="1520" y="768" font-size="10.5" fill="#5f6368">14 publishing now · each refreshed at most hourly</text>

  <!-- snapshots -->
  <rect x="1500" y="790" width="400" height="72" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="1520" y="818" font-size="13.5" font-weight="700" fill="#202124">Manual snapshots</text>
  <text x="1520" y="840" font-size="10.5" fill="#3c4043">Handshake 227 · club directory 119</text>
  <text x="1520" y="858" font-size="10.5" fill="#5f6368">checked in as data/seed.json — no live sync</text>

  <!-- resend -->
  <rect x="1500" y="872" width="400" height="78" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="1520" y="900" font-size="13.5" font-weight="700" fill="#202124">Resend</text>
  <text x="1520" y="922" font-size="10.5" fill="#3c4043">Sign-in codes, resets, digests, privacy replies</text>
  <text x="1520" y="940" font-size="10.5" fill="#5f6368">Inbound webhook + MX on AWS us-east-1</text>

  <!-- deepseek -->
  <rect x="1500" y="954" width="400" height="72" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="1520" y="980" font-size="13.5" font-weight="700" fill="#202124">DeepSeek API</text>
  <text x="1520" y="1000" font-size="10.5" fill="#3c4043">deepseek-flash · OpenAI-compatible chat</text>
  <text x="1520" y="1018" font-size="10.5" fill="#5f6368">Search assist + profile question wording</text>

  <!-- planned workflow -->
  <rect x="1500" y="1056" width="400" height="94" rx="10" fill="#fef0df" stroke="#e8710a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1520" y="1082" font-size="13.5" font-weight="700" fill="#a94d00">AI workflow automation — PLANNED</text>
  <text x="1520" y="1104" font-size="10.5" fill="#3c4043">New-source intake → clean → tag → dedupe</text>
  <text x="1520" y="1122" font-size="10.5" fill="#3c4043">Stages drafts in the review queue for a moderator</text>
  <text x="1520" y="1140" font-size="10.5" fill="#5f6368">Calls DeepSeek to classify; never publishes alone</text>

  <!-- ============ arrows ============ -->
  <!-- visitor -> cloudflare -->
  <line x1="580" y1="250" x2="580" y2="318" stroke="#202124" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="592" y="274" width="182" height="17" rx="3" fill="#ffffff"/>
  <text x="595" y="286" font-size="10" fill="#3c4043">HTTPS · search, filters, .ics</text>

  <!-- moderator -> cloudflare -->
  <line x1="1130" y1="250" x2="1130" y2="318" stroke="#202124" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="1142" y="274" width="140" height="17" rx="3" fill="#ffffff"/>
  <text x="1145" y="286" font-size="10" fill="#3c4043">HTTPS · session cookie</text>

  <!-- cloudflare -> nginx -->
  <line x1="580" y1="430" x2="580" y2="528" stroke="#202124" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="592" y="438" width="164" height="17" rx="3" fill="#ffffff"/>
  <text x="595" y="450" font-size="10" fill="#3c4043">proxied HTTP + client IP</text>

  <line x1="1130" y1="430" x2="1130" y2="528" stroke="#202124" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="1142" y="438" width="164" height="17" rx="3" fill="#ffffff"/>
  <text x="1145" y="450" font-size="10" fill="#3c4043">proxied HTTP + client IP</text>

  <!-- nginx -> node -->
  <line x1="580" y1="640" x2="580" y2="698" stroke="#202124" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="592" y="660" width="156" height="17" rx="3" fill="#ffffff"/>
  <text x="595" y="672" font-size="10" fill="#3c4043">HTML · event JSON · .ics</text>

  <line x1="1130" y1="640" x2="1130" y2="698" stroke="#202124" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="1142" y="660" width="150" height="17" rx="3" fill="#ffffff"/>
  <text x="1145" y="672" font-size="10" fill="#3c4043">HTML · moderation JSON</text>

  <!-- crontab -> node -->
  <line x1="330" y1="1000" x2="378" y2="1000" stroke="#5f6368" stroke-width="2" marker-end="url(#ahG)"/>
  <rect x="330" y="978" width="48" height="15" rx="3" fill="#ffffff"/>
  <text x="333" y="989" font-size="8.5" fill="#5f6368">cron POST</text>

  <!-- cross-app -->
  <line x1="750" y1="858" x2="948" y2="858" stroke="#e8710a" stroke-width="2.5" marker-end="url(#ahO)"/>
  <rect x="782" y="826" width="142" height="17" rx="3" fill="#ffffff"/>
  <text x="786" y="838" font-size="10" fill="#a94d00">reports, listings, tags</text>

  <line x1="950" y1="972" x2="752" y2="972" stroke="#e8710a" stroke-width="2.5" marker-end="url(#ahO)"/>
  <rect x="783" y="988" width="154" height="17" rx="3" fill="#ffffff"/>
  <text x="786" y="1000" font-size="10" fill="#a94d00">hide · restore · patches</text>

  <!-- customer -> D1 -->
  <line x1="580" y1="1115" x2="580" y2="1188" stroke="#202124" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="592" y="1143" width="186" height="17" rx="3" fill="#ffffff"/>
  <text x="595" y="1155" font-size="10" fill="#3c4043">sessions, bookmarks, listings</text>

  <!-- admin -> D1 -->
  <line x1="1130" y1="1115" x2="1130" y2="1188" stroke="#202124" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="1142" y="1143" width="154" height="17" rx="3" fill="#ffffff"/>
  <text x="1145" y="1155" font-size="10" fill="#3c4043">overrides, hides, inbox</text>

  <text x="860" y="1160" font-size="10" text-anchor="middle" fill="#a94d00">the two surfaces meet in D1</text>

  <!-- node <-> sources -->
  <line x1="1340" y1="745" x2="1498" y2="745" stroke="#202124" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="1342" y="722" width="156" height="17" rx="3" fill="#ffffff"/>
  <text x="1346" y="734" font-size="10" fill="#3c4043">iCal · HTML · Events.json</text>

  <!-- snapshots -> node (manual import, one way) -->
  <line x1="1498" y1="826" x2="1342" y2="826" stroke="#5f6368" stroke-width="2" marker-end="url(#ahG)"/>
  <rect x="1342" y="804" width="156" height="17" rx="3" fill="#ffffff"/>
  <text x="1346" y="816" font-size="10" fill="#5f6368">seed JSON import</text>

  <!-- node <-> resend -->
  <line x1="1340" y1="911" x2="1498" y2="911" stroke="#202124" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="1342" y="888" width="156" height="17" rx="3" fill="#ffffff"/>
  <text x="1346" y="900" font-size="10" fill="#3c4043">emails + webhook</text>
  <rect x="1342" y="914" width="156" height="16" rx="3" fill="#ffffff"/>
  <text x="1346" y="925" font-size="9.5" fill="#5f6368">codes, digests, replies</text>

  <!-- node <-> deepseek -->
  <line x1="1340" y1="991" x2="1498" y2="991" stroke="#202124" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="1342" y="968" width="156" height="17" rx="3" fill="#ffffff"/>
  <text x="1346" y="980" font-size="10" fill="#3c4043">chat/completions</text>

  <!-- planned workflow -> node -->
  <line x1="1498" y1="1096" x2="1342" y2="1096" stroke="#e8710a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ahO)"/>
  <rect x="1342" y="1073" width="156" height="17" rx="3" fill="#ffffff"/>
  <text x="1346" y="1085" font-size="10" fill="#a94d00">staged drafts</text>

  <!-- planned workflow -> deepseek -->
  <line x1="1700" y1="1054" x2="1700" y2="1030" stroke="#e8710a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ahO)"/>
  <text x="1712" y="1048" font-size="9" fill="#a94d00">classify prompts</text>

  <!-- ============ footnote ============ -->
  <g font-size="10.5" fill="#5f6368">
    <text x="60" y="1318">The admin portal is not a separate service: it is moderator-only routes in the same Node deployment, sharing one D1 database,</text>
    <text x="60" y="1336">one Nginx proxy and one Linux host. Arrow-by-arrow data and the planned workflow: README.md → System architecture.</text>
  </g>
</svg>
